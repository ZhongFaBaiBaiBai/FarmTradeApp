name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 设置 Android SDK
      uses: android-actions/setup-android@v4

    - name: 安装 Android SDK 组件
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: 安装 Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
        unzip -q gradle-8.4-bin.zip
        echo "GRADLE_HOME=$PWD/gradle-8.4" >> $GITHUB_ENV
        echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

    - name: 缓存 Gradle 依赖
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
        restore-keys: gradle-

    - name: 创建 local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: 下载 Vosk 语音模型（打包进 APK）
      run: |
        MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip"
        ASSETS_DIR="app/src/main/assets/vosk-model"
        mkdir -p "$ASSETS_DIR"
        echo "正在下载语音模型..."
        wget -q "$MODEL_URL" -O /tmp/vosk-model.zip
        echo "下载完成，正在解压..."
        unzip -q /tmp/vosk-model.zip -d /tmp/vosk-tmp
        # 去掉顶层目录，直接复制模型文件
        cp -r /tmp/vosk-tmp/vosk-model-small-cn-0.22/* "$ASSETS_DIR/"
        echo "模型已放入 assets 目录"
        rm -rf /tmp/vosk-model.zip /tmp/vosk-tmp

    - name: 构建 Debug APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
        echo "=== 构建结果 ==="
        if grep -q "BUILD SUCCESSFUL" /tmp/build.log; then
          echo "✅ 构建成功"
        else
          echo "❌ 构建失败，以下是错误摘要："
          grep -n "error:" /tmp/build.log | head -30
          echo "---"
          grep -n "^e: " /tmp/build.log | head -30
          echo "---"
          grep -n "FAILURE\|Caused by" /tmp/build.log | tail -20
        fi
        cat /tmp/build.log > build-full.log
        echo "完整日志已保存到 build-full.log"

    - name: 上传构建日志（失败时）
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-full.log
        retention-days: 7

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: FarmTradeApp-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
